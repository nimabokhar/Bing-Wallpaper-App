name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "VERSION"
      - ".github/scripts/release.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "VERSION"
      - ".github/scripts/release.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # A push to main whose VERSION has no release yet becomes that release.
      # Every other build is a snapshot and gets the run number as build metadata.
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            ../.github/scripts/release.sh check
          else
            echo "version=$(tr -d '[:space:]' < ../VERSION)" >> "$GITHUB_OUTPUT"
            echo "kind=snapshot" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret set; using a debug key."
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.version.outputs.kind == 'snapshot' && github.run_number || '' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk bing-wallpaper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bing-wallpaper-apk
          path: android/bing-wallpaper.apk

      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Built automatically from main. Download bing-wallpaper.apk on your phone to install."
          gh release upload latest bing-wallpaper.apk --clobber

      - name: Publish the versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp bing-wallpaper.apk "bing-wallpaper-${{ steps.version.outputs.version }}.apk"
          ../.github/scripts/release.sh publish "bing-wallpaper-${{ steps.version.outputs.version }}.apk"
